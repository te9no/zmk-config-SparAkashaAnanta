name: Ananta wireless recovery prerelease build
on:
  workflow_dispatch:
  push:
    branches: [feat/bt-recovery, codex/ananta-input-motion-fix, codex/ananta-hid-fairness, codex/ananta-key-state-recovery]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: zmkfirmware/zmk-build-arm:4.1
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target: [SAA_L_MODULE_TB, SAA_L_MODULE_JOY, SAA_L_MODULE_ENC, SAA_L_MODULE_TPD, SAA_L_MODULE_KEY, SAA_L_MODULE_TB_IQS, SAA_L_MODULE_JOY_IQS, SAA_L_MODULE_ENC_IQS, SAA_L_MODULE_TPD_IQS, SAA_L_MODULE_KEY_IQS, SAA_R_MODULE_TB, SAA_R_MODULE_JOY, SAA_R_MODULE_ENC, SAA_R_MODULE_TPD, SAA_R_MODULE_KEY, SAA_R_MODULE_TB_IQS, SAA_R_MODULE_JOY_IQS, SAA_R_MODULE_ENC_IQS, SAA_R_MODULE_TPD_IQS, SAA_R_MODULE_KEY_IQS, settings_reset]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          path: config-repo
      - name: Prepare isolated dependencies
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/config-repo"
          mkdir -p west-workspace/manifest
          cp config-repo/config/west.yml west-workspace/manifest/west.yml
          cd west-workspace
          west init -l manifest
          west update --narrow
      - name: Test actual recovery bridge and policy
        if: matrix.target == 'SAA_R_MODULE_TB'
        working-directory: west-workspace
        run: |
          python3 ../config-repo/scripts/apply-bt-recovery.py zmk
          sh modules/zmk-module-bt-recovery/tests/run.sh
          python3 modules/zmk-module-bt-recovery/tests/test_bridge.py zmk
      - name: Test input and motion regressions
        if: matrix.target == 'SAA_R_MODULE_TB'
        run: |
          HOG_SOURCE="$GITHUB_WORKSPACE/west-workspace/zmk/app/src/hog.c" PMW_SOURCE="$GITHUB_WORKSPACE/west-workspace/modules/zmk-driver-pmw3610-with-custom-studio-rpc/src/pmw3610.c" python3 -m unittest discover -s config-repo/tests -v
      - name: Build and verify
        working-directory: west-workspace
        run: python3 ../config-repo/scripts/build-bt-recovery.py ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: bt-recovery-${{ matrix.target }}
          path: west-workspace/release-artifacts/*
          if-no-files-found: error
